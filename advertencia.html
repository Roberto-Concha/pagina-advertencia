<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Alerta de Seguridad - Simulación</title> 
 
    <style> 
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif; 
        } 
 
        body { 
            min-height: 100vh; 
            background: #f1f3f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        } 
 
        .alerta { 
            width: 90%; 
            max-width: 600px; 
            background: white; 
            border-radius: 15px; 
            padding: 35px; 
            text-align: center; 
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); 
            border-top: 8px solid #d93025; 
        } 
 
        .icono { 
            font-size: 65px; 
            margin-bottom: 15px; 
        } 
 
        h1 { 
            color: #d93025; 
            margin-bottom: 15px; 
        } 
 
        .advertencia { 
            font-size: 18px; 
            color: #333; 
            line-height: 1.6; 
            margin-bottom: 20px; 
        } 
 
        .simulacion { 
            background: #fff3cd; 
            border: 1px solid #ffe69c; 
            color: #664d03; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            font-weight: bold; 
        } 
 
        button { 
            background: #d93025; 
            color: white; 
            border: none; 
            padding: 13px 25px; 
            border-radius: 7px; 
            font-size: 16px; 
            cursor: pointer; 
        } 
 
        button:hover { 
            background: #b3261e; 
        } 
 
        #mensaje { 
            margin-top: 20px; 
            color: #188038; 
            font-weight: bold; 
            display: none; 
        } 
    </style> 
</head> 
 
<body> 
 
    <div class="alerta"> 
 
        <div class="icono">⚠️</div> 
 
        <h1>Advertencia de Seguridad</h1> 
 
        <p class="advertencia"> 
            Se ha detectado una actividad sospechosa relacionada 
            con la seguridad de la información personal. 
        </p> 
 
        <div class="simulacion"> 
            SI QUIERES RECUPERAR TU INFORMACION PERSONAL Y EVITAR QUE SE HAGA PUBLICA
            <br> 
            Escribe a este numero 0990776836. 
        </div> 
 
        <a href="https://wa.me/593990776836" target="_blank">
        <button>Entendido</button>
        </a> 
 
        <p id="mensaje"> 
            ✓ haz sido haqueado. 
        </p> 
 
    </div> 
 
    <script> 
        function mostrarMensaje() { 
            document.getElementById("mensaje").style.display = "block"; 
        } 
    </script> 
 
</body> 
</html>
